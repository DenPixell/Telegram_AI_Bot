# Основной режим: docker compose up --build  (db + app + web)
# Реальный деплой с HTTPS и бэкапами:  docker compose --profile prod up -d --build
# Локальная модель без внешних ключей: docker compose --profile local up -d --build

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: expenses
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432" # для локального go run, наружу не открыт
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # REST API + Telegram-бот в одном процессе. Миграции применяются при старте.
  # Строго одна реплика: две реплики с long polling получают 409 Conflict от Telegram.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080" # API напрямую - для отладки; снаружи панель ходит через web
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1", memory: 256M }
    logging: *logging

  # Веб-панель: статика SPA + прокси /api на app:8080 с того же origin (PUBLIC_URL).
  web:
    build:
      context: web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    logging: *logging

  # ---------- профиль prod ----------

  # TLS для реального деплоя: Caddy сам получает сертификат Let's Encrypt для DOMAIN.
  # Нужно: DNS-запись домена на сервер, открытые 80/443, PUBLIC_URL=https://DOMAIN.
  caddy:
    image: caddy:2-alpine
    profiles: [prod]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # Ежедневный pg_dump в ./backups, хранится BACKUP_KEEP_DAYS дней.
  backup:
    image: postgres:16-alpine
    profiles: [prod]
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: expenses
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  # ---------- профиль local ----------

  # Локальная модель без ключей и интернета. После старта один раз:
  #   docker compose exec ollama ollama pull qwen2.5:7b
  # и в .env: LLM_BASE_URL=http://ollama:11434/v1, LLM_MODEL=qwen2.5:7b, LLM_API_KEY=
  ollama:
    image: ollama/ollama
    profiles: [local]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
