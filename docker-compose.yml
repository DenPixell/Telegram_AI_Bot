x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: expenses
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432" # для локального go run, наружу не открыт
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # REST API + Telegram-бот в одном процессе. Миграции применяются при старте.
  # Строго одна реплика: две реплики с long polling получают 409 Conflict от Telegram.
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1", memory: 256M }
    logging: *logging

  # Веб-панель: статика SPA + прокси /api на app:8080 с того же origin (PUBLIC_URL).
  web:
    build:
      context: web
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    logging: *logging

  # TODO(этап 10-11): профили prod (caddy, backup) и local (ollama).

volumes:
  pgdata:
