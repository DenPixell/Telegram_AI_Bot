openapi: 3.1.0
info:
  title: Expense Bot Panel API
  version: 0.3.0
  description: |
    REST API веб-панели владельца семьи.

    - user_id и family_id берутся только из сессии, в запросах их не передают
      (кроме user_id участника, на которого создаётся трата).
    - Деньги - строка "350.00", даты траты - "YYYY-MM-DD", моменты времени - RFC 3339 в UTC.
    - Режим PANEL_AUTH_MODE=magic_link: владелец пишет боту «панель», получает ссылку
      `PUBLIC_URL/auth?token=...`; страница панели отправляет токен в POST /api/auth/exchange.
      Сессия - HttpOnly cookie `sid`. Изменяющие запросы требуют заголовок X-CSRF-Token
      (значение из /api/me) и, если браузер прислал Origin, совпадения с PUBLIC_URL.
    - Режим PANEL_AUTH_MODE=none: авторизации нет, все запросы от имени владельца семьи
      PANEL_FAMILY_ID (или единственной семьи). Только для локального демо.
servers:
  - url: /
security:
  - session: []
paths:
  /healthz:
    get:
      summary: Живость процесса
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Готовность (БД доступна)
      security: []
      responses:
        "200": { description: OK }
        "503": { description: БД недоступна }

  /api/auth/exchange:
    post:
      summary: Обмен одноразового токена из ссылки бота на сессию
      description: Только в режиме magic_link. Токен живёт 10 минут и действует один раз. Лимит 30 запросов в минуту.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        "200":
          description: Сессия выдана, cookie `sid` установлена
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/logout:
    post:
      summary: Выход (удаление сессии)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Сессия удалена }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/me:
    get:
      summary: Текущий владелец, семья и CSRF-токен
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/categories:
    get:
      summary: Список категорий
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

  /api/expenses:
    get:
      summary: Траты семьи с фильтрами
      parameters:
        - { name: member_id, in: query, schema: { type: integer, format: int64 }, description: Telegram ID члена семьи }
        - { name: from, in: query, schema: { type: string, format: date }, description: Дата траты от (включительно) }
        - { name: to, in: query, schema: { type: string, format: date }, description: Дата траты до (включительно) }
        - name: category
          in: query
          description: Можно повторять или перечислять через запятую
          schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
          style: form
          explode: true
        - { name: q, in: query, schema: { type: string }, description: Поиск по названию и комментарию }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Страница трат; total и count посчитаны по всему фильтру
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Создать трату (свою или члена семьи)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCreate" }
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/expenses/summary:
    get:
      summary: Итоги по категориям, людям и дням для тех же фильтров, что у /api/expenses
      parameters:
        - { name: member_id, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { type: array, items: { $ref: "#/components/schemas/Category" } }, style: form, explode: true }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: Трата
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Изменить трату (оптимистичная блокировка по version)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseUpdate" }
      responses:
        "200":
          description: Изменена, version увеличена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Удалить трату
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалена }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/family:
    get:
      summary: Семья
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
    put:
      summary: Изменить название и часовой пояс семьи
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, timezone]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 64 }
                timezone: { type: string, description: IANA, example: Europe/Moscow }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/members:
    get:
      summary: Участники семьи (владелец первым)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
  /api/members/{userID}:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Изменить подпись участника («жена», «сын»)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relation]
              additionalProperties: false
              properties:
                relation: { type: string, maxLength: 32 }
      responses:
        "204": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Удалить участника из семьи (его траты остаются)
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Удалён }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/members/{userID}/transfer-ownership:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: Передать владение
      description: Сессии обоих пользователей удаляются, текущий владелец теряет доступ к панели.
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Владение передано }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/invites:
    get:
      summary: Действующие приглашения
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
    post:
      summary: Создать приглашение
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
  /api/invites/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      summary: Отозвать приглашение
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Отозвано }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Значение csrf_token из /api/me (в режиме none не требуется)
      schema: { type: string }
  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      example: "350.00"
    Category:
      type: string
      enum: [еда, транспорт, жильё, развлечения, здоровье, покупки, другое]
    Family:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        timezone: { type: string, example: Europe/Moscow }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [owner] }
        family: { $ref: "#/components/schemas/Family" }
        csrf_token: { type: string, description: Пусто в режиме none }
        auth_mode: { type: string, enum: [magic_link, none] }
    Expense:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, description: Telegram ID владельца траты }
        amount: { $ref: "#/components/schemas/Money" }
        category: { $ref: "#/components/schemas/Category" }
        date: { type: string, format: date }
        title: { type: string, description: Каноническое название из словаря, example: ресторан }
        comment: { type: string, description: Как написал пользователь }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExpenseList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        total: { $ref: "#/components/schemas/Money" }
        count: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Summary:
      type: object
      properties:
        total: { $ref: "#/components/schemas/Money" }
        count: { type: integer }
        by_category:
          type: array
          description: По убыванию суммы
          items:
            type: object
            properties:
              category: { $ref: "#/components/schemas/Category" }
              total: { $ref: "#/components/schemas/Money" }
              count: { type: integer }
        by_member:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer, format: int64 }
              total: { $ref: "#/components/schemas/Money" }
              count: { type: integer }
        by_day:
          type: array
          description: Только дни с тратами, по возрастанию даты (до 400)
          items:
            type: object
            properties:
              date: { type: string, format: date }
              total: { $ref: "#/components/schemas/Money" }
    ExpenseCreate:
      type: object
      required: [amount, category]
      additionalProperties: false
      properties:
        user_id: { type: integer, format: int64, description: "Член семьи; 0 или нет поля - сам владелец" }
        amount: { $ref: "#/components/schemas/Money" }
        category: { $ref: "#/components/schemas/Category" }
        date: { type: string, format: date, description: По умолчанию сегодня в поясе участника }
        title: { type: string, maxLength: 64 }
        comment: { type: string, maxLength: 200 }
    ExpenseUpdate:
      type: object
      required: [version, amount, category, date]
      additionalProperties: false
      properties:
        version: { type: integer, description: Из последнего ответа; при несовпадении 409 }
        amount: { $ref: "#/components/schemas/Money" }
        category: { $ref: "#/components/schemas/Category" }
        date: { type: string, format: date }
        title: { type: string, maxLength: 64 }
        comment: { type: string, maxLength: 200 }
    Member:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        display_name: { type: string }
        username: { type: string }
        role: { type: string, enum: [owner, member] }
        relation: { type: string }
        joined_at: { type: string, format: date-time }
    Invite:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, example: K7M2Q-9XH4T }
        link: { type: string, description: "https://t.me/<bot>?start=<CODE>; нет, пока неизвестен username бота" }
        expires_at: { type: string, format: date-time }
        max_uses: { type: integer }
        used_count: { type: integer }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [bad_request, validation, unauthenticated, forbidden, bad_origin, bad_csrf, not_found,
                     conflict, owner_must_stay, family_full, rate_limited, internal]
            message: { type: string, description: Текст для показа пользователю }
  responses:
    BadRequest:
      description: Некорректный запрос или ошибка валидации
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Нет действующей сессии
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Недостаточно прав, чужой Origin или неверный CSRF-токен
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Не найдено (в том числе запись другой семьи)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Запись изменена параллельно (version устарела)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Слишком много запросов
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
