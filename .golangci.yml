version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # незакрытые тела HTTP-ответов
    - errorlint     # сравнение ошибок через errors.Is/As
    - gosec         # базовые проверки безопасности
    - noctx         # HTTP-запросы без context
    - sqlclosecheck
    - rowserrcheck
    - unconvert
    - copyloopvar
  settings:
    gosec:
      excludes:
        - G104 # дублирует errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofmt
