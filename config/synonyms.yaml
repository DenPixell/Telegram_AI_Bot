# Слова действий над тратами (для фильтра правил). Сравниваются по основе слова.
action_words:
  # «потратил» здесь нет: «я потратил 550 на шавуху» - это трата, а не запрос; вопросы ловит «сколько».
  list: [сколько, покажи, показать, траты, расходы, итого, статистика, отчет, список, история]
  delete: [удали, удалить, убери, убрать, сотри, стереть, отмени, отменить]
  update: [измени, изменить, поправь, исправь, исправить, замени, заменить, последнее, последняя, последний]

# Запрещённые темы и инструкции: сообщение с ними отклоняется без обращения к LLM.
# hard - всегда; soft - только если в сообщении нет слов действий над тратами
# («посчитай мои расходы» допустимо, «посчитай интеграл» - нет).
stop_words:
  hard: [напиши, напишите, сочини, сделай, сделайте, реши, решите, разработай, разработайте, объясни, объясните, переведи, переведите, придумай, придумайте, расскажи, расскажите, игнорируй, игнорировать, забудь, инструкция, инструкции, промпт, prompt, системный, system, assistant, jailbreak, представь, притворись, ролевая, сгенерируй, генерируй, нарисуй, код, программу, домашку, домашнее, сочинение, реферат, эссе, бизнес-план, анекдот, стих, стихотворение, гороскоп]
  soft: [посчитай, вычисли, рассчитай, подскажи, помоги, что, как, почему, зачем, кто]
  phrases: [кто ты, какая ты, какой ты, что ты такое, какая модель, ты кто, ты бот, ты chatgpt, ты гпт, ignore previous, ignore all, previous instructions, бизнес модель, бизнес-модель]

# Служебные слова, которые не являются названием траты.
filler_words: [я, мы, мне, нам, себе, ты, на, в, во, за, для, из, с, со, к, по, у, о, об, и, а, но, или, ещё, еще, поход, сходил, сходила, сходили, купил, купила, купили, взял, взяла, взяли, заплатил, заплатила, заплатили, оплатил, оплатила, оплата, оплатили, потратил, потратила, потратили, трата, расход, это, мой, моя, мои, наш, наша, сегодня, вчера, позавчера, примерно, около, где-то, всего]
