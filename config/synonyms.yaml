# Словарь синонимов и категорий. Редактируется без перекомпиляции.
# terms: канонический title -> разговорные формы и категория по умолчанию.
# Категории: еда, транспорт, жильё, развлечения, здоровье, покупки, другое.
terms:
  ресторан:
    aliases: [рестик, рестораны, ресторанчик, рест, кафе, кафешка, общепит]
    category: еда
  кофе:
    aliases: [кофейка, кофеек, кофеёк, капучино, латте, американо]
    category: еда
  шаурма:
    aliases: [шава, шаверма]
    category: еда
  такси:
    aliases: [убер, яндекс такси, такси до дома]
    category: транспорт
  аптека:
    aliases: [аптеку, лекарства, таблетки]
    category: здоровье
  бензин:
    aliases: [заправка, азс, топливо]
    category: транспорт

action_words:
  list: [сколько, покажи, траты, расходы, итого, потратил]
  delete: [удали, убери, сотри]
  update: [измени, поправь, исправь, "не .* а"]

stop_words: [напиши, сделай, реши, разработай, объясни, переведи, придумай, расскажи, посчитай, игнорируй, забудь, инструкц, промпт]
