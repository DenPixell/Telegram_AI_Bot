# Словарь синонимов и категорий. Редактируется без перекомпиляции (перезапуск сервера).
#
# terms: канонический title -> категория и разговорные формы. Формы пишутся в начальной форме:
#   падежи и числа («рестике», «шаурмой», «такси до дома») распознаются стеммером.
#   Многословные формы («яндекс такси») совпадают по последовательности основ.
# Категории: еда, транспорт, жильё, развлечения, здоровье, покупки, другое.
#
# Обобщающие слова («блюдо», «напиток», «лекарство») тоже terms: через них онлайн-тезаурус
# (гиперонимы Викисловаря) находит категорию для незнакомых слов: «латте» -> «напиток» -> еда.

