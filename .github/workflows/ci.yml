name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Раннер закреплён: ubuntu-latest переезжает на Ubuntu 26 (19.10.2026), обновление - осознанно.
# Экшены - на мажорных версиях с Node 24 (Node 20 на раннерах устарел).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: expenses
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d expenses"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # pgtest создаёт на этом сервере отдельную БД для каждого тестового пакета.
      TEST_DB_DSN: postgres://app:app@localhost:5432/expenses?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Short fuzzing
        run: |
          go test ./internal/pipeline -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 20s
          go test ./internal/pipeline -run '^$' -fuzz '^FuzzParseAmounts$' -fuzztime 20s

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build panel image
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
